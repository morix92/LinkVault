<div class="auth-card">

  <h2>Registrati</h2>

  <input type="text" placeholder="Username" [ngModel]="username()" (ngModelChange)="username.set($event)"/>
  <input type="password" placeholder="Password" [ngModel]="password()" (ngModelChange)="password.set($event)"/>
  <input type="password" placeholder="Conferma Password" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"/>

  <button type="button" (click)="register()">Registrati</button>

</div>
