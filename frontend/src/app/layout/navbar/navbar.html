<nav class="navbar">

    <div class="brand">
        <img src="logo.png" alt="LinkVault Logo" class="logo">
        <span>LinkVault</span>
    </div>

    <div class="actions">

        @if (!isAuthenticated()) {

            @if (isLoginPage()) {
                <a routerLink="/register" class="nav-link">Registrati</a>
            } @else {
                <a routerLink="/login" class="nav-link">Accedi</a>
            }

        } @else {

            <div class="profileContainer">
                <a routerLink="/profile" class="profile-link">
                    <img src="profileIcon.png" alt="Profilo" class="profile">
                </a>
                <p>{{ username() }}</p>
            </div>
            

            <button type="button" class="logout-btn" (click)="logout()">Logout</button>

        }

    </div>

</nav>
