services:
  postgres:
    image: postgres:17
    container_name: linkvault-postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: linkvault-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:

    build:
      context: ./frontend

    container_name: linkvault-frontend

    restart: unless-stopped

    ports:
      - "4200:80"
     
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
  
      
volumes:
  postgres_data: